<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery Highlight - NewJeans Fan Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="gallery-section" id="gallery">
      <header class="gallery-header">
        <h1 class="gallery-title">Gallery Highlight</h1>
        <p class="gallery-subtitle">
          A minimalist spotlight reel&mdash;tap thumbnails for a full-screen
          view.
        </p>
      </header>

      <div class="card-row">
        <article class="gallery-card">
          <div class="card-image">
            <img
              src="images/gallery/gallery1.jpg"
              alt="Soft pastel stage photo"
            />
            <span class="carousel-dots"><i></i><i></i><i></i></span>
          </div>
          <div class="card-body">
            <div class="card-tags">
              <span class="tag">#Stage</span>
              <span class="tag">#Fresh</span>
            </div>
            <div class="card-profile">
              <span class="avatar"></span>
              <span class="profile-name">NewJeans Official</span>
            </div>
            <div class="card-icons">
              <svg class="icon icon-heart" viewBox="0 0 24 24">
                <path
                  d="M12 21s-7.5-4.6-10-9.1C0.3 8.6 1.7 5 5.2 4.2 7.6 3.6 9.9 4.7 12 7c2.1-2.3 4.4-3.4 6.8-2.8 3.5 0.8 4.9 4.4 3.2 7.7C19.5 16.4 12 21 12 21z"
                />
              </svg>
              <svg class="icon icon-comment" viewBox="0 0 24 24">
                <path d="M4 4h16v12H8l-4 4V4z" />
              </svg>
              <svg class="icon icon-spark" viewBox="0 0 24 24">
                <path
                  d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"
                />
              </svg>
            </div>
          </div>
        </article>

        <article class="gallery-card">
          <div class="card-image">
            <img
              src="images/gallery/gallery2.jpg"
              alt="Behind-the-scenes candid"
            />
            <span class="carousel-dots"><i></i><i></i><i></i></span>
          </div>
          <div class="card-body">
            <div class="card-tags">
              <span class="tag">#BTS</span>
              <span class="tag">#Cute</span>
            </div>
            <div class="card-profile">
              <span class="avatar"></span>
              <span class="profile-name">NewJeans Official</span>
            </div>
            <div class="card-icons">
              <svg class="icon icon-heart" viewBox="0 0 24 24">
                <path
                  d="M12 21s-7.5-4.6-10-9.1C0.3 8.6 1.7 5 5.2 4.2 7.6 3.6 9.9 4.7 12 7c2.1-2.3 4.4-3.4 6.8-2.8 3.5 0.8 4.9 4.4 3.2 7.7C19.5 16.4 12 21 12 21z"
                />
              </svg>
              <svg class="icon icon-comment" viewBox="0 0 24 24">
                <path d="M4 4h16v12H8l-4 4V4z" />
              </svg>
              <svg class="icon icon-spark" viewBox="0 0 24 24">
                <path
                  d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"
                />
              </svg>
            </div>
          </div>
        </article>

        <article class="gallery-card">
          <div class="card-image">
            <img
              src="images/gallery/gallery3.jpg"
              alt="Concept shot monochrome"
            />
            <span class="carousel-dots"><i></i><i></i><i></i></span>
          </div>
          <div class="card-body">
            <div class="card-tags">
              <span class="tag">#Concept</span>
              <span class="tag">#Minimal</span>
            </div>
            <div class="card-profile">
              <span class="avatar"></span>
              <span class="profile-name">NewJeans Official</span>
            </div>
            <div class="card-icons">
              <svg class="icon icon-heart" viewBox="0 0 24 24">
                <path
                  d="M12 21s-7.5-4.6-10-9.1C0.3 8.6 1.7 5 5.2 4.2 7.6 3.6 9.9 4.7 12 7c2.1-2.3 4.4-3.4 6.8-2.8 3.5 0.8 4.9 4.4 3.2 7.7C19.5 16.4 12 21 12 21z"
                />
              </svg>
              <svg class="icon icon-comment" viewBox="0 0 24 24">
                <path d="M4 4h16v12H8l-4 4V4z" />
              </svg>
              <svg class="icon icon-spark" viewBox="0 0 24 24">
                <path
                  d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"
                />
              </svg>
            </div>
          </div>
        </article>
      </div>

      <button
        class="see-more-btn"
        id="toggleMoreBtn"
        aria-expanded="false"
        aria-controls="moreGrid"
      >
        <span>Tap to see more</span>
        <svg class="arrow-icon" viewBox="0 0 24 24">
          <path d="M8 5l10 7-10 7V5z" />
        </svg>
      </button>

      <div class="more-grid" id="moreGrid" hidden>
        <img
          src="images/gallery/gallery4.jpg"
          alt="Foto galeri 4"
          class="more-img"
        />
        <img
          src="images/gallery/gallery5.jpg"
          alt="Foto galeri 5"
          class="more-img"
        />
        <img
          src="images/gallery/gallery6.jpg"
          alt="Foto galeri 6"
          class="more-img"
        />
        <img
          src="images/gallery/gallery7.jpg"
          alt="Foto galeri 7"
          class="more-img"
        />
        <img
          src="images/gallery/gallery8.jpg"
          alt="Foto galeri 8"
          class="more-img"
        />
        <img
          src="images/gallery/gallery9.jpg"
          alt="Foto galeri 9"
          class="more-img"
        />
        <img
          src="images/gallery/gallery10.jpg"
          alt="Foto galeri 10"
          class="more-img"
        />
        <img
          src="images/gallery/gallery11.jpg"
          alt="Foto galeri 11"
          class="more-img"
        />
        <img
          src="images/gallery/gallery12.jpg"
          alt="Foto galeri 12"
          class="more-img"
        />
      </div>
    </main>

    <script>
      const btn = document.getElementById("toggleMoreBtn");
      const grid = document.getElementById("moreGrid");
      const label = btn.querySelector("span");

      btn.addEventListener("click", () => {
        const isHidden = grid.hasAttribute("hidden");
        if (isHidden) {
          grid.removeAttribute("hidden");
          label.textContent = "Show less";
          btn.classList.add("is-open");
          btn.setAttribute("aria-expanded", "true");
          grid.scrollIntoView({ behavior: "smooth", block: "nearest" });
        } else {
          grid.setAttribute("hidden", "");
          label.textContent = "Tap to see more";
          btn.classList.remove("is-open");
          btn.setAttribute("aria-expanded", "false");
        }
      });
    </script>
  </body>
</html>
