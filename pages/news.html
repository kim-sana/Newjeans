<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Highlight news and articles from the NewJeans fan hub."
    />
    <title>News — NewJeans</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;1,700;1,800;1,900&family=Bagel+Fat+One&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="../assets/images/brand/favicon.png" />
    <link rel="stylesheet" href="../assets/css/theme.css" />
    <link rel="stylesheet" href="../assets/vendor/locomotive-scroll/locomotive-scroll.css" />
    <link rel="stylesheet" href="../assets/css/news.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div id="navbar-placeholder"></div>

    <main id="main">
      <section class="page-hero dot-blue">
        <div class="container">
          <span class="ribbon">Latest stories</span>
          <h1 class="page-title">Highlight News</h1>
          <p class="page-lead">Read the highlights featured on Home.</p>
        </div>
      </section>

      <section class="section news-page-main dot-paper">
        <div class="container">
          <div class="news-page-heading">
            <p class="eyebrow">The latest</p>
            <h2 id="newsViewTitle">All stories</h2>
          </div>
          <div id="newsContent" class="news-content" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/news-data.js" defer></script>
    <script src="../assets/vendor/locomotive-scroll/locomotive-scroll.min.js" defer></script>
    <script src="../assets/js/theme.js" defer></script>
    <script src="../assets/js/news.js" defer></script>
  </body>
</html>
