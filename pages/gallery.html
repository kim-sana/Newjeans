<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore NewJeans gallery photos in an interactive coverflow carousel."
    />
    <title>Gallery — NewJeans</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;1,700;1,800;1,900&family=Bagel+Fat+One&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="../assets/images/brand/favicon.png" />
    <link rel="stylesheet" href="../assets/css/theme.css" />
    <link
      rel="stylesheet"
      href="../assets/vendor/locomotive-scroll/locomotive-scroll.css"
    />
    <link rel="stylesheet" href="../assets/css/home.css" />
  </head>
  <body class="gallery-page">
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="navbar-placeholder"></div>

    <main id="main">
      <section class="section gallery-section" id="gallery">
        <div class="container">
          <div class="sec-head sec-head--center reveal">
            <div>
              <h1>Gallery</h1>
              <p class="sec-lead">
                A rotating look at stages, concept shoots and candid moments
                from the Bunnies universe.
              </p>
            </div>
          </div>

          <div
            class="coverflow"
            id="coverflow"
            role="region"
            aria-roledescription="carousel"
            aria-label="NewJeans gallery photos">
            <div class="coverflow-stage" id="coverflowStage" tabindex="0">
              <div class="coverflow-track" id="coverflowTrack"></div>
              <p class="sr-only" id="slideAnnouncement" aria-live="polite"></p>
            </div>

            <div class="coverflow-controls">
              <button
                class="coverflow-arrow"
                id="previousSlide"
                type="button"
                aria-label="Previous photo">
                <span aria-hidden="true">←</span>
              </button>
              <div
                class="coverflow-pagination"
                id="slidePagination"
                role="group"
                aria-label="Carousel pagination">
                <button
                  class="pagination-dot is-active"
                  type="button"
                  data-page="0"
                  aria-label="Go to pagination dot 1"
                  aria-current="page"></button>
                <button
                  class="pagination-dot"
                  type="button"
                  data-page="1"
                  aria-label="Go to pagination dot 2"></button>
                <button
                  class="pagination-dot"
                  type="button"
                  data-page="2"
                  aria-label="Go to pagination dot 3"></button>
              </div>
              <button
                class="coverflow-arrow"
                id="nextSlide"
                type="button"
                aria-label="Next photo">
                <span aria-hidden="true">→</span>
              </button>
            </div>
          </div>

          <div class="masonry-wrapper" id="masonryWrapper" inert>
            <div class="masonry-grid" id="galleryGrid"></div>
          </div>

          <div class="gallery-actions">
            <button
              id="expandGalleryBtn"
              class="btn btn--ghost"
              type="button"
              aria-expanded="false"
              aria-controls="masonryWrapper">
              View full gallery
            </button>
          </div>
        </div>
      </section>

      <div
        id="imageModal"
        class="image-modal"
        role="dialog"
        aria-modal="true"
        aria-label="Gallery viewer"
        aria-hidden="true">
        <span
          class="close-modal"
          id="closeModal"
          role="button"
          tabindex="0"
          aria-label="Close gallery"
          >&times;</span
        >
        <button
          class="modal-nav-btn prev-btn"
          id="prevModalBtn"
          type="button"
          aria-label="Previous image">
          &lt;
        </button>
        <img class="modal-content" id="modalImg" alt="Gallery image enlarged" />
        <button
          class="modal-nav-btn next-btn"
          id="nextModalBtn"
          type="button"
          aria-label="Next image">
          &gt;
        </button>
      </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/components.js"></script>
    <script
      src="../assets/vendor/locomotive-scroll/locomotive-scroll.min.js"
      defer></script>
    <script src="../assets/js/theme.js" defer></script>
    <script src="../assets/js/gallery-carousel.js" defer></script>
    <script src="../assets/js/gallery-controls.js" defer></script>
  </body>
</html>
