<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Gallery Coverflow Experiment — NewJeans</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;1,700;1,800;1,900&family=Bagel+Fat+One&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/theme.css" />
    <link rel="stylesheet" href="../assets/css/home.css" />
    <link rel="stylesheet" href="gallery-coverflow.css" />
    <script src="gallery-coverflow.js" defer></script>
  </head>
  <body>
    <main>
      <section class="section gallery-section experiment-gallery" aria-labelledby="gallery-title">
        <div class="container experiment-container">
          <div class="sec-head sec-head--center">
            <div>
              <h1 id="gallery-title">Gallery</h1>
              <p class="sec-lead">
                A rotating look at stages, concept shoots and candid moments
                from the Bunnies universe.
              </p>
            </div>
          </div>

          <div
            class="coverflow"
            id="coverflow"
            role="region"
            aria-roledescription="carousel"
            aria-label="NewJeans gallery photos">
            <div class="coverflow-stage" id="coverflowStage" tabindex="0">
              <div class="coverflow-track" id="coverflowTrack"></div>
              <p class="sr-only" id="slideAnnouncement" aria-live="polite"></p>
            </div>

            <div class="coverflow-controls">
              <button class="coverflow-arrow" id="previousSlide" type="button" aria-label="Previous photo">
                <span aria-hidden="true">←</span>
              </button>
              <div class="coverflow-pagination" id="slidePagination" role="group" aria-label="Carousel pagination">
                <button class="pagination-dot is-active" type="button" data-page="0" aria-label="Go to pagination dot 1" aria-current="page"></button>
                <button class="pagination-dot" type="button" data-page="1" aria-label="Go to pagination dot 2"></button>
                <button class="pagination-dot" type="button" data-page="2" aria-label="Go to pagination dot 3"></button>
              </div>
              <button class="coverflow-arrow" id="nextSlide" type="button" aria-label="Next photo">
                <span aria-hidden="true">→</span>
              </button>
            </div>
          </div>

          <div class="gallery-actions experiment-actions">
            <button
              id="expandGalleryBtn"
              class="btn btn--ghost"
              type="button"
              aria-expanded="false"
              aria-controls="masonryWrapper">
              View full gallery
            </button>
          </div>

          <div class="masonry-wrapper experiment-grid-wrapper" id="masonryWrapper" inert>
            <div class="experiment-grid" id="galleryGrid"></div>
          </div>
        </div>
      </section>

      <div
        class="image-modal experiment-modal"
        id="imageModal"
        role="dialog"
        aria-modal="true"
        aria-label="Gallery viewer"
        aria-hidden="true">
        <button class="close-modal" id="closeModal" type="button" aria-label="Close gallery">&times;</button>
        <button class="modal-nav-btn prev-btn" id="prevModalBtn" type="button" aria-label="Previous image">&lt;</button>
        <img class="modal-content" id="modalImg" alt="" />
        <button class="modal-nav-btn next-btn" id="nextModalBtn" type="button" aria-label="Next image">&gt;</button>
      </div>
    </main>
  </body>
</html>
